<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ExpenseFlow">
  <defs>
    <linearGradient id="ef-body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A7466"/>
      <stop offset="0.55" stop-color="#134238"/>
      <stop offset="1" stop-color="#0A2420"/>
    </linearGradient>
    <linearGradient id="ef-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FE3CF" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#9FE3CF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="ef-glow" cx=".3" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ef-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EFEA"/>
    </linearGradient>
    <linearGradient id="ef-saffron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC768"/>
      <stop offset="1" stop-color="#E0861F"/>
    </linearGradient>
    <filter id="ef-drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#03110E" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- body -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ef-body)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ef-glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#ef-rim)" stroke-width="8"/>
  <g transform="translate(-14 -8)">
  <!-- glyph: extrusion layer -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40" transform="translate(0 14)" stroke="#061A16" opacity=".55">
    <path d="M150 140 H340 M150 206 H340 M196 140 C300 140 300 272 196 272 H168 L262 386 L384 214"/>
  </g>
  <!-- glyph: face -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40" filter="url(#ef-drop)">
    <path d="M150 140 H340 M150 206 H340 M196 140 C300 140 300 272 196 272 H168 L262 386" stroke="url(#ef-ivory)"/>
    <path d="M262 386 L384 214" stroke="url(#ef-saffron)"/>
  </g>
  <!-- specular on tick -->
  <path d="M282 352 L370 228" stroke="#FFF3D6" stroke-opacity=".7" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
