groups:
  - name: expenseflow
    rules:
      - alert: OldestPendingApprovalTooOld
        # Brief: alert on oldest pending approval. Threshold 72h = 3 working days (validated against seed: normal max ~60h per step).
        expr: expenseflow_oldest_pending_approval_hours > 72
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "A claim has waited {{ $value | humanize }}h for approval (threshold 72h)"
          runbook: "submission/runbook.md#alert-oldestpendingapprovaltooold"
      - alert: ApprovalQueueBacklog
        expr: sum(expenseflow_approval_queue_size) > 150
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Approval backlog is {{ $value }} claims"
          runbook: "submission/runbook.md#alert-approvalqueuebacklog"
      - alert: HighPageLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(expenseflow_http_request_duration_seconds_bucket{route!="/metrics"}[5m]))) > 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "p95 request latency is {{ $value | humanizeDuration }} (> 1s)"
          runbook: "submission/runbook.md#alert-highpagelatencyp95"
      - alert: ExpenseFlowDown
        expr: up{job="expenseflow"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "ExpenseFlow app is not answering /metrics"
          runbook: "submission/runbook.md#alert-expenseflowdown"
